services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: gridpulse
      POSTGRES_USER: gridpulse
      POSTGRES_PASSWORD: gridpulse_dev
    ports:
      - "5432:5432"
    volumes:
      - gridpulse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridpulse -d gridpulse"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://gridpulse:gridpulse_dev@timescaledb:5432/gridpulse}
      GRID_SOURCE_URL: ${GRID_SOURCE_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_TABLE: ${SUPABASE_TABLE:-hourly_generation}
      GRID_SOURCE_POLL_SECONDS: ${GRID_SOURCE_POLL_SECONDS:-3600}
      GRID_SOURCE_TIMEZONE: ${GRID_SOURCE_TIMEZONE:-Asia/Dhaka}
      GRID_NATIONAL_BASELINE_DEMAND_MW: ${GRID_NATIONAL_BASELINE_DEMAND_MW:-15000}
      GRID_PERSIST_INTERVAL_SECONDS: ${GRID_PERSIST_INTERVAL_SECONDS:-300}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
      GRID_TICK_SECONDS: "3"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO"]
    environment:
      DATABASE_URL: postgresql+asyncpg://gridpulse:gridpulse_dev@timescaledb:5432/gridpulse
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/ws/live
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  gridpulse-db:
